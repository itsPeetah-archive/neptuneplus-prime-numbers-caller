apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: functions.openfaas.com
spec:
  group: openfaas.com
  scope: Namespaced
  names:
    plural: functions
    singular: function
    kind: Function
    shortNames:
      - fn
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - name
                - image
              properties:
                name:
                  type: string
                  pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                image:
                  type: string
                annotations:
                  type: object
                  additionalProperties:
                    type: string
                labels:
                  type: object
                  additionalProperties:
                    type: string
                constraints:
                  type: array
                  items:
                    type: string # Assuming constraints are a list of strings
                secrets:
                  type: array
                  items:
                    type: string # Assuming secrets are a list of strings
                environment:
                  description: "Environment variables for the function."
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                readOnlyRootFilesystem:
                  type: boolean
                limits:
                  type: object
                  properties:
                    cpu:
                      type: string
                      pattern: "^[0-9]+(m)"
                    memory:
                      type: string
                      pattern: "^[0-9]+(Mi|Gi)"
                requests:
                  type: object
                  properties:
                    cpu:
                      type: string
                      pattern: "^[0-9]+(m)"
                    memory:
                      type: string
                      pattern: "^[0-9]+(Mi|Gi)"
            status:
              type: object
              properties:
                # Add any status fields you expect for your Function CRD here
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
      additionalPrinterColumns:
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=='Ready')].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
    - name: v1alpha2
      served: true
      storage: false
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - name
                - image
              properties:
                name:
                  type: string
                  pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                image:
                  type: string
                annotations:
                  type: object
                  additionalProperties:
                    type: string
                labels:
                  type: object
                  additionalProperties:
                    type: string
                constraints:
                  type: array
                  items:
                    type: string # Assuming constraints are a list of strings
                secrets:
                  type: array
                  items:
                    type: string # Assuming secrets are a list of strings
                readOnlyRootFilesystem:
                  type: boolean
                limits:
                  type: object
                  properties:
                    cpu:
                      type: string
                      pattern: "^[0-9]+(m)"
                    memory:
                      type: string
                      pattern: "^[0-9]+(Mi|Gi)"
                requests:
                  type: object
                  properties:
                    cpu:
                      type: string
                      pattern: "^[0-9]+(m)"
                    memory:
                      type: string
                      pattern: "^[0-9]+(Mi|Gi)"
            status:
              type: object
              properties:
                # Add any status fields you expect for your Function CRD here
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
      additionalPrinterColumns:
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=='Ready')].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
