apiVersion: systemautoscaler.polimi.it/v1beta1
kind: ServiceLevelAgreement
metadata:
  name: pnc-seq-deps
  namespace: openfaas-fn
spec:
  metric:
    responseTime: 110m
  defaultResources:
    cpu: "100m"
    memory: "768Mi"
  minResources:
    cpu: 100m
    memory: 10Mi
  maxResources:
    cpu: 20000m
    memory: 2048Mi
  recommenderLogic: dependencyAware
  service:
    container: pnc-seq-deps
    selector:
      matchLabels:
        name: pnc-seq-deps
