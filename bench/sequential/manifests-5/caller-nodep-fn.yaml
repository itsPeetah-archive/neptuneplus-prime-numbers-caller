apiVersion: openfaas.com/v1
kind: Function
metadata:
  name: pnc-seq-nodeps
  namespace: openfaas-fn
spec:
  image: itspeetah/np-prime-numbers-caller:dev
  labels:
    com.openfaas.scale.factor: "20"
    com.openfaas.scale.max: "100"
    com.openfaas.scale.min: "1"
    com.openfaas.scale.zero: "false"
    edgeautoscaler.polimi.it/scheduler: edge-autoscaler
  name: pnc-seq-nodeps
  readOnlyRootFilesystem: false
  limits:
    cpu: "200m"
    memory: "1000Mi"
  requests:
    cpu: "200m"
    memory: "1000Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: pnc-seq-nodeps
  labels:
    name: pnc-seq-nodeps
  namespace: openfaas-fn
spec:
  ports:
    - port: 80
      targetPort: 8000
  selector:
    edgeautoscaler.polimi.it/function-name: "pnc-seq-nodeps"
    edgeautoscaler.polimi.it/function-namespace: "openfaas-fn"
---
apiVersion: systemautoscaler.polimi.it/v1beta1
kind: ServiceLevelAgreement
metadata:
  name: pnc-seq-nodeps
  namespace: openfaas-fn
spec:
  metric:
    responseTime: 1000m
  defaultResources:
    cpu: "100m"
    memory: "768Mi"
  minResources:
    cpu: 100m
    memory: 10Mi
  maxResources:
    cpu: 20000m
    memory: 2048Mi
  service:
    container: pnc-seq-nodeps
    selector:
      matchLabels:
        name: pnc-seq-nodeps
