apiVersion: openfaas.com/v1
kind: Function
metadata:
  name: prime-numbers-caller-withdeps
  namespace: openfaas-fn
spec:
  image: itspeetah/np-prime-numbers-caller:dev
  labels:
    com.openfaas.scale.factor: "20"
    com.openfaas.scale.max: "100"
    com.openfaas.scale.min: "1"
    com.openfaas.scale.zero: "false"
    edgeautoscaler.polimi.it/scheduler: edge-autoscaler
  name: prime-numbers-caller-withdeps
  readOnlyRootFilesystem: false
  limits:
    cpu: "200m"
    memory: "1000Mi"
  requests:
    cpu: "200m"
    memory: "1000Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: prime-numbers-caller-withdeps
  labels:
    name: prime-numbers-caller-withdeps
  namespace: openfaas-fn
spec:
  ports:
    - port: 80
      targetPort: 8000
  selector:
    edgeautoscaler.polimi.it/function-name: "prime-numbers-caller-withdeps"
    edgeautoscaler.polimi.it/function-namespace: "openfaas-fn"
---
apiVersion: systemautoscaler.polimi.it/v1beta1
kind: ServiceLevelAgreement
metadata:
  name: prime-numbers-caller-withdeps
  namespace: openfaas-fn
spec:
  metric:
    responseTime: 40m
  defaultResources:
    cpu: 300m
    memory: 768Mi
  minResources:
    cpu: 150m
    memory: 10Mi
  maxResources:
    cpu: 10000m
    memory: 2048Mi
  recommenderLogic: dependencyAware
  service:
    container: prime-numbers-caller-withdeps
    selector:
      matchLabels:
        name: prime-numbers-caller-withdeps
